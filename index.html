<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Qahiri&display=swap"
      rel="stylesheet"
    />
    <title>Projeto Relógio Premium</title>
  </head>
  <body>
    <div class="relogio">
      <div class="info">
        <div class="dia-semana" id="diaSemana">Segunda-feira</div>
        <div class="data" id="data">13 de abril</div>
      </div>
      <div class="display-container">
        <div class="display" id="display">
          <span class="digit" id="h1">0</span>
          <span class="digit" id="h2">0</span>
          <span class="separador">:</span>
          <span class="digit" id="m1">0</span>
          <span class="digit" id="m2">0</span>
          <span class="separador">:</span>
          <span class="digit" id="s1">0</span>
          <span class="digit" id="s2">0</span>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-content">
        <div class="footer-line"></div>
        <p class="footer-text">Desenvolvido com dedicação por <span class="footer-name">Fernando Sonaglio</span></p>
        <p class="footer-copyright">&#169; 2024 &middot; Todos os direitos reservados</p>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
